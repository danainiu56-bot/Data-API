<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="公司统一数据资产平台可点击原型" />
  <title>DataHub · 企业数据资产平台</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #69758a;
      --line: #e1e6ef;
      --nav: #111827;
      --nav-soft: #1f2937;
      --primary: #315fd4;
      --primary-dark: #2349ad;
      --primary-soft: #eaf0ff;
      --success: #1d8056;
      --success-soft: #e8f6ef;
      --warning: #aa671b;
      --warning-soft: #fff3e4;
      --danger: #b74754;
      --danger-soft: #fdecee;
      --purple: #7151aa;
      --purple-soft: #f2edfb;
      --shadow: 0 12px 34px rgba(23, 32, 51, 0.08);
      --radius: 14px;
      --sidebar: 244px;
      --topbar: 64px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      display: flex;
      width: var(--sidebar);
      flex-direction: column;
      color: #fff;
      background: var(--nav);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      height: var(--topbar);
      padding: 0 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      color: #fff;
      background: var(--primary);
      font-size: 11px;
      font-weight: 800;
    }

    .brand-copy strong { display: block; font-size: 14px; }
    .brand-copy span { color: rgba(255, 255, 255, 0.48); font-size: 10px; }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
    }

    .nav-group { margin-bottom: 18px; }

    .nav-label {
      padding: 0 10px 7px;
      color: rgba(255, 255, 255, 0.36);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 2px 0;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.66);
      background: transparent;
      text-align: left;
      transition: 0.18s ease;
    }

    .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
    .nav-item.active { color: #fff; background: var(--primary); }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 9px;
      font-weight: 800;
    }

    .sidebar-footer {
      padding: 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    .role-card {
      padding: 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
    }

    .role-card small { color: rgba(255, 255, 255, 0.42); }
    .role-card strong { display: block; margin-top: 3px; font-size: 12px; }

    .main { grid-column: 2; min-width: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--topbar);
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
    }

    .top-search {
      position: relative;
      width: min(460px, 44vw);
    }

    .top-search input {
      width: 100%;
      height: 38px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: var(--panel-soft);
    }

    .top-search input:focus { border-color: var(--primary); background: #fff; }
    .top-search::before { position: absolute; top: 8px; left: 13px; color: var(--muted); content: "⌕"; font-size: 18px; }

    .top-actions { display: flex; align-items: center; gap: 10px; }

    .role-select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .content { padding: 24px; }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .page-head h1 { margin: 0; font-size: 24px; letter-spacing: -0.03em; }
    .page-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-weight: 700;
      font-size: 12px;
    }

    .btn:hover { border-color: #b8c4d8; background: var(--panel-soft); }
    .btn.primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.danger { color: var(--danger); border-color: #f0cbd0; background: var(--danger-soft); }
    .btn:disabled { cursor: not-allowed; opacity: 0.52; }

    .cards-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .cards-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr); gap: 14px; }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 6px 18px rgba(23, 32, 51, 0.035);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .card-head strong { font-size: 13px; }
    .card-body { padding: 16px; }

    .stat-card { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin: 8px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.04em; }
    .stat-meta { color: var(--success); font-size: 11px; }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--muted);
      background: #eef1f6;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .pill.success { color: var(--success); background: var(--success-soft); }
    .pill.warning { color: var(--warning); background: var(--warning-soft); }
    .pill.danger { color: var(--danger); background: var(--danger-soft); }
    .pill.info { color: var(--primary); background: var(--primary-soft); }
    .pill.purple { color: var(--purple); background: var(--purple-soft); }

    .list { display: grid; gap: 0; }

    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .list-row:last-child { border-bottom: 0; }
    .list-title { margin-bottom: 3px; font-weight: 700; font-size: 12px; }
    .list-sub { color: var(--muted); font-size: 11px; }

    .guide-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .guide-step { position: relative; padding: 13px; border-radius: 10px; background: var(--panel-soft); border: 1px solid var(--line); }
    .guide-step b { color: var(--primary); font-size: 11px; }
    .guide-step strong { display: block; margin: 6px 0 3px; font-size: 12px; }
    .guide-step small { color: var(--muted); }

    .filterbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .field, .select {
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
    }

    .field:focus, .select:focus, textarea:focus { border-color: var(--primary); }
    .field.grow { flex: 1; min-width: 220px; }

    .market-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
    .category-panel { position: sticky; top: calc(var(--topbar) + 16px); max-height: calc(100vh - var(--topbar) - 40px); overflow-y: auto; padding: 12px; }
    .market-filters { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .market-filters .field { width: 100%; min-width: 0; }
    .category-all, .category-main, .category-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; border: 0; color: var(--muted); background: transparent; text-align: left; }
    .category-all, .category-main { min-height: 38px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 750; }
    .category-all:hover, .category-main:hover, .category-sub:hover { color: var(--primary); background: var(--primary-soft); }
    .category-all.active, .category-main.active { color: #fff; background: var(--primary); }
    .category-all.active .category-count, .category-main.active .category-count { color: #fff; background: rgba(255,255,255,.18); }
    .category-group { margin-top: 4px; }
    .category-subs { display: grid; gap: 2px; margin: 3px 0 8px; padding-left: 12px; }
    .category-sub { min-height: 30px; padding: 0 9px; border-radius: 7px; font-size: 11px; }
    .category-sub.active { color: var(--primary); background: var(--primary-soft); font-weight: 750; }
    .api-tree-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 7px; width: 100%; min-height: 42px; padding: 6px 8px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; text-align: left; }
    .api-tree-item:hover { color: var(--primary); background: var(--primary-soft); }
    .api-tree-item.active { color: var(--primary); background: var(--primary-soft); box-shadow: inset 3px 0 var(--primary); }
    .api-tree-item .method { min-width: 32px; padding: 3px 4px; font-size: 8px; text-align: center; }
    .api-tree-copy { min-width: 0; }
    .api-tree-copy strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .api-tree-copy small { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .category-arrow { color: var(--muted); font-size: 9px; }
    .market-detail-pane { min-width: 0; }
    .market-detail-pane .detail-hero { margin-top: 0; }
    .api-basic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--line); }
    .api-basic-item { min-width: 0; padding: 11px 12px; background: #fff; }
    .api-basic-item.wide { grid-column: span 2; }
    .api-basic-item small { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9px; }
    .api-basic-item strong, .api-basic-item code { display: block; overflow: hidden; color: var(--ink); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .api-reference { padding: 22px; }
    .reference-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .reference-head h2 { margin: 0 0 5px; font-size: 18px; }
    .reference-section { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .reference-section:last-child { border-bottom: 0; }
    .reference-title { margin: 0 0 12px; font-size: 13px; }
    .reference-title span { margin-right: 8px; color: var(--primary); }
    .reference-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
    .reference-meta div { min-width: 0; }
    .reference-meta small { display: block; margin-bottom: 4px; color: var(--muted); font-size: 9px; }
    .reference-meta strong, .reference-meta code { font-size: 10px; overflow-wrap: anywhere; }
    .reference-code { position: relative; }
    .reference-code .btn { position: absolute; top: 8px; right: 8px; z-index: 1; }

    .asset-type-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .asset-type-card { padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); text-align: left; }
    .asset-type-card:hover, .asset-type-card.active { border-color: var(--primary); background: var(--primary-soft); }
    .asset-type-card strong { display: block; margin: 8px 0 4px; font-size: 12px; }
    .asset-type-card small { color: var(--muted); font-size: 9px; }
    .asset-type-card .stat-value { font-size: 21px; }
    .asset-catalog-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 14px; }
    .asset-filter-panel { position: sticky; top: calc(var(--topbar) + 16px); padding: 12px; }
    .asset-filter-group + .asset-filter-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .asset-filter-group strong { display: block; margin-bottom: 8px; font-size: 10px; }
    .asset-filter-option { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 31px; padding: 0 8px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 10px; text-align: left; }
    .asset-filter-option:hover, .asset-filter-option.active { color: var(--primary); background: var(--primary-soft); }
    .asset-list { display: grid; gap: 10px; }
    .asset-row { display: grid; grid-template-columns: minmax(230px, 1.7fr) repeat(4, minmax(90px, .7fr)) 36px; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--panel); text-align: left; }
    .asset-row:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .asset-row-title strong { display: block; margin-bottom: 4px; font-size: 12px; }
    .asset-row-title small, .asset-cell small { display: block; color: var(--muted); font-size: 9px; }
    .asset-cell strong { display: block; margin-top: 3px; font-size: 10px; }
    .quality-track { height: 5px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: #e8edf5; }
    .quality-track span { display: block; height: 100%; border-radius: inherit; background: var(--success); }
    .asset-detail-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, .8fr); gap: 14px; }
    .lineage-flow { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 8px 0; }
    .lineage-node { min-width: 130px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-soft); }
    .lineage-node strong { display: block; margin-bottom: 4px; font-size: 10px; }
    .lineage-arrow { color: var(--primary); font-weight: 800; }
    .report-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .report-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--panel); text-align: left; }
    .report-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .report-card h3 { margin: 12px 0 6px; font-size: 14px; }
    .report-card p { min-height: 34px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .report-preview { display: flex; align-items: end; gap: 5px; height: 55px; margin-top: 14px; padding: 8px; border-radius: 8px; background: var(--panel-soft); }
    .report-preview span { flex: 1; border-radius: 3px 3px 0 0; background: var(--primary); opacity: .75; }
    .chart-panel { min-height: 260px; padding: 18px; }
    .chart-bars { display: flex; align-items: end; gap: 12px; height: 185px; padding: 18px 8px 0; border-bottom: 1px solid var(--line); }
    .chart-bar { flex: 1; position: relative; min-width: 26px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--primary), #8ca9ff); }
    .chart-bar small { position: absolute; bottom: -24px; left: 50%; color: var(--muted); font-size: 8px; transform: translateX(-50%); }
    .relation-list { display: grid; gap: 8px; }
    .relation-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); }
    .category-count { min-width: 24px; padding: 2px 6px; border-radius: 999px; color: var(--muted); background: #eef1f6; font-size: 9px; text-align: center; }
    .category-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .category-summary h2 { margin: 0 0 4px; font-size: 17px; }
    .category-summary p { margin: 0; color: var(--muted); font-size: 11px; }
    .category-stats { display: flex; gap: 18px; color: var(--muted); font-size: 10px; text-align: right; }
    .category-stats strong { display: block; color: var(--ink); font-size: 16px; }
    .category-toggle { display: none; }

    .api-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

    .api-card {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      text-align: left;
      transition: 0.18s ease;
    }

    .api-card:hover { transform: translateY(-2px); border-color: #a9b9d7; box-shadow: var(--shadow); }
    .api-card-top { display: flex; justify-content: space-between; gap: 10px; }
    .method { color: var(--success); font-size: 10px; font-weight: 850; }
    .api-card h3 { margin: 10px 0 6px; font-size: 15px; }
    .api-card p { min-height: 38px; margin: 0; color: var(--muted); font-size: 11px; }
    .api-card-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }

    .breadcrumb { margin-bottom: 13px; color: var(--muted); font-size: 11px; }
    .breadcrumb button { padding: 0; border: 0; color: var(--primary); background: transparent; }

    .detail-hero { padding: 20px; }
    .detail-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .detail-title h1 { margin: 8px 0 7px; font-size: 24px; }
    .endpoint { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--panel-soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .meta-row strong { color: var(--ink); }

    .tabs { display: flex; gap: 3px; margin-top: 16px; border-bottom: 1px solid var(--line); }
    .tab { padding: 10px 13px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; font-size: 12px; font-weight: 700; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .doc-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 0.75fr); gap: 14px; margin-top: 14px; }
    .section-title { margin: 4px 0 10px; font-size: 14px; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { padding: 9px 10px; color: var(--muted); background: var(--panel-soft); text-align: left; font-weight: 750; }
    td { padding: 10px; border-top: 1px solid var(--line); vertical-align: top; }
    tr:hover td { background: #fbfcfe; }

    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code-box { position: relative; overflow: auto; padding: 14px; border-radius: 10px; color: #d8e2f4; background: #111827; font-size: 11px; line-height: 1.7; white-space: pre-wrap; }
    .copy-btn { position: absolute; top: 8px; right: 8px; padding: 5px 7px; border: 1px solid rgba(255,255,255,.16); border-radius: 6px; color: #fff; background: rgba(255,255,255,.08); font-size: 9px; }

    .form-group { margin-bottom: 13px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; outline: none; background: #fff; }
    .form-group input, .form-group select { height: 36px; padding: 0 10px; }
    .form-group textarea { min-height: 84px; padding: 10px; resize: vertical; }

    .notice { padding: 11px 12px; border: 1px solid #cdd9f1; border-radius: 9px; color: var(--primary-dark); background: var(--primary-soft); font-size: 11px; }
    .notice.warning { color: var(--warning); border-color: #efd6b7; background: var(--warning-soft); }
    .notice.success { color: var(--success); border-color: #bee2d0; background: var(--success-soft); }

    .table-card { overflow: hidden; }
    .table-toolbar { display: flex; flex-wrap: wrap; gap: 9px; padding: 12px; border-bottom: 1px solid var(--line); }

    .app-card { padding: 16px; }
    .app-card h3 { margin: 0 0 5px; font-size: 14px; }
    .credential { margin-top: 13px; padding: 10px; border-radius: 8px; background: var(--panel-soft); font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); }

    .bar-list { display: grid; gap: 12px; }
    .bar-head { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; }
    .bar-track { height: 7px; overflow: hidden; border-radius: 99px; background: #edf0f5; }
    .bar-fill { height: 100%; border-radius: inherit; background: var(--primary); }

    .tag-group-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--panel-soft); font-size: 10px; }
    .tag-chip b { color: var(--primary); font-weight: 750; }
    .policy-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .policy-block { padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-soft); }
    .policy-block h3 { margin: 0 0 5px; font-size: 13px; }
    .policy-block p { margin: 0 0 12px; color: var(--muted); font-size: 10px; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .checkbox-row { display: flex; align-items: center; gap: 7px; min-height: 31px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 10px; }
    .permission-result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .result-panel { padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft); }
    .result-panel strong { display: block; margin-bottom: 7px; font-size: 12px; }
    .result-panel ul { margin: 0; padding-left: 17px; color: var(--muted); font-size: 10px; }
    .result-panel li + li { margin-top: 4px; }

    .empty { padding: 42px 20px; text-align: center; }
    .empty strong { display: block; margin-bottom: 6px; }
    .empty p { margin: 0; color: var(--muted); font-size: 12px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 15, 27, 0.48);
      backdrop-filter: blur(3px);
    }

    .modal-backdrop.open { display: flex; }
    .modal { width: min(720px, 96vw); max-height: 88vh; overflow: auto; border-radius: 16px; background: #fff; box-shadow: 0 24px 70px rgba(8, 15, 27, 0.22); }
    .modal.sm { width: min(500px, 96vw); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-close { width: 30px; height: 30px; border: 0; border-radius: 7px; color: var(--muted); background: var(--panel-soft); }
    .modal-body { padding: 18px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 13px 18px; border-top: 1px solid var(--line); }

    .wizard-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 18px; }
    .wizard-step { padding: 8px; border-radius: 8px; color: var(--muted); background: var(--panel-soft); font-size: 10px; text-align: center; }
    .wizard-step.active { color: #fff; background: var(--primary); }
    .wizard-step.done { color: var(--success); background: var(--success-soft); }
    .source-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .source-choice { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: left; }
    .source-choice:hover, .source-choice.selected { border-color: var(--primary); background: var(--primary-soft); }
    .source-choice strong { display: block; margin-bottom: 6px; }
    .source-choice span { color: var(--muted); font-size: 11px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      display: none;
      padding: 12px 15px;
      border-radius: 10px;
      color: #fff;
      background: var(--nav);
      box-shadow: var(--shadow);
      font-size: 12px;
    }

    .toast.show { display: block; animation: toast-in .2s ease both; }
    @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

    .mobile-menu { display: none; }

    @media (max-width: 1120px) {
      .cards-4, .api-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .guide-steps { grid-template-columns: repeat(2, 1fr); }
      .doc-layout, .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      :root { --sidebar: 0px; }
      .app-shell { display: block; }
      .sidebar { width: 260px; transform: translateX(-100%); transition: .2s ease; }
      .sidebar.open { transform: translateX(0); }
      .main { grid-column: 1; }
      .topbar { padding: 0 12px; }
      .mobile-menu { display: inline-flex; }
      .top-search { display: none; }
      .role-select { width: 138px; }
      .content { padding: 16px 12px 34px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .cards-4, .cards-3, .api-grid, .source-choices { grid-template-columns: 1fr; }
      .tag-group-grid, .policy-grid, .permission-result { grid-template-columns: 1fr; }
      .asset-type-grid, .report-grid { grid-template-columns: 1fr; }
      .asset-catalog-layout, .asset-detail-grid { grid-template-columns: 1fr; }
      .asset-filter-panel { position: static; }
      .asset-row { grid-template-columns: 1fr; }
      .market-layout { grid-template-columns: 1fr; }
      .category-toggle { display: inline-flex; }
      .category-panel { display: none; position: static; max-height: none; }
      .category-panel.open { display: block; }
      .category-summary { align-items: flex-start; flex-direction: column; }
      .category-stats { width: 100%; justify-content: flex-start; text-align: left; }
      .guide-steps { grid-template-columns: 1fr; }
      .wizard-steps { grid-template-columns: repeat(3, 1fr); }
      .table-card { overflow-x: auto; }
      table { min-width: 720px; }
    }
  </style>
</head>
<body>

    <main class="main">

  <div class="modal-backdrop" id="modalBackdrop">

      <div class="modal-foot" id="modalFoot"></div>

  <div class="toast" id="toast"></div>

  <script>
    const apiCategories = [
      { name: "基础数据", desc: "公司统一的产品、组织、站点、仓库和币种等公共基础资料。", subs: ["产品档案", "分类品牌", "组织站点", "仓库币种"] },
      { name: "销售", desc: "覆盖订单、支付、退款、价格促销和认证销售指标。", subs: ["订单", "支付退款", "销售指标", "价格促销"] },
      { name: "供应链", desc: "覆盖供应商、采购、供应计划、可供量、交期和供应绩效。", subs: ["供应商", "采购订单", "供应计划", "交期绩效"] },
      { name: "广告", desc: "覆盖广告活动、关键词、投放花费、转化和效果指标。", subs: ["广告结构", "关键词", "投放数据", "效果指标"] },
      { name: "库存", desc: "覆盖可售、仓库、在途、周转、健康度和库存调整。", subs: ["实时库存", "在途库存", "库存健康", "库存流水"] },
      { name: "物流", desc: "覆盖发货、轨迹、渠道、运费、妥投时效和异常包裹。", subs: ["发货履约", "物流轨迹", "渠道运费", "时效异常"] },
      { name: "市场竞品", desc: "覆盖竞品档案、价格排名、品类趋势和竞争格局。", subs: ["竞品档案", "价格排名", "品类趋势", "竞争分析"] },
      { name: "用户 / VOC", desc: "覆盖评论明细、主题情绪、用户痛点和需求洞察。", subs: ["评论明细", "主题情绪", "痛点需求"] },
      { name: "内容知识", desc: "覆盖产品卖点、说明书、Listing、素材和合规证据。", subs: ["产品卖点", "说明书", "Listing 素材", "合规知识"] }
    ];

    const categoryOwners = {
      "基础数据": "主数据组", "销售": "经营分析组", "供应链": "供应链数据组",
      "广告": "广告数据组", "库存": "库存数据组", "物流": "物流数据组",
      "市场竞品": "市场洞察组", "用户 / VOC": "用户洞察组", "内容知识": "内容中台组"
    };

    function apiDef(id, name, category, subcategory, endpoint, desc, method = "GET", access = "已授权", status = "已认证", calls = "1.2万") {
      const pathMatch = endpoint.match(/\{([^}]+)\}/);
      return {
        id, name, category, subcategory, domain: category, endpoint, desc, method, access, status, calls,
        owner: categoryOwners[category], sla: status === "试运行" ? "99.50%" : "99.90%",
        latency: method === "POST" ? "146ms" : "92ms", param: pathMatch ? pathMatch[1] : method === "POST" ? "query" : "id",
        tags: [category, subcategory, status, access, method === "POST" ? "查询服务" : "读取服务"]
      };
    }

    const apis = [
      apiDef("product", "SKU / PN 产品档案", "基础数据", "产品档案", "/v1/products/{sku}", "查询产品主档、PN、规格和跨站点编码。", "GET", "已授权", "已认证", "12.8万"),
      apiDef("spu-map", "SKU / SPU 关系查询", "基础数据", "产品档案", "/v1/products/{sku}/relations", "查询 SKU、PN、SPU 和套装关系。"),
      apiDef("category-tree", "标准品类树", "基础数据", "分类品牌", "/v1/master/categories", "查询公司标准品类层级、路径和启用状态。"),
      apiDef("brand", "品牌主数据", "基础数据", "分类品牌", "/v1/master/brands/{brand_code}", "查询品牌、所属公司和授权市场。"),
      apiDef("sites", "站点与店铺", "基础数据", "组织站点", "/v1/master/sites", "查询业务线、国家站点、店铺和组织关系。"),
      apiDef("warehouse", "仓库与币种汇率", "基础数据", "仓库币种", "/v1/master/warehouses", "查询仓库基础信息、币种和日汇率。"),
      apiDef("orders", "销售订单列表", "销售", "订单", "/v1/sales/orders", "按站点、店铺、时间和状态查询销售订单。", "POST", "已授权", "已认证", "18.6万"),
      apiDef("order-detail", "订单与商品明细", "销售", "订单", "/v1/sales/orders/{order_id}", "查询订单、订单行、商品、税费和履约信息。"),
      apiDef("payments", "支付流水查询", "销售", "支付退款", "/v1/sales/payments", "查询支付方式、金额、币种和支付状态。", "POST"),
      apiDef("refunds", "退款明细查询", "销售", "支付退款", "/v1/sales/refunds", "查询退款原因、金额、商品和处理状态。", "POST"),
      apiDef("metric", "认证销售指标查询", "销售", "销售指标", "/v1/metrics/sales/query", "查询 GMV、净销售额、订单数、买家数和利润。", "POST", "已授权", "已认证", "9.6万"),
      apiDef("promotions", "商品价格与促销", "销售", "价格促销", "/v1/sales/promotions", "查询商品售价、折扣、促销活动和有效期。", "POST"),
      apiDef("suppliers", "供应商档案", "供应链", "供应商", "/v1/supply/suppliers/{supplier_id}", "查询供应商资质、品类和合作状态。"),
      apiDef("purchase-orders", "采购订单查询", "供应链", "采购订单", "/v1/supply/purchase-orders", "查询采购订单、商品数量、金额和状态。", "POST", "角色受限"),
      apiDef("supply-plan", "供应计划查询", "供应链", "供应计划", "/v1/supply/plans", "查询 SKU 周度供应计划和计划版本。", "POST", "角色受限"),
      apiDef("supply-forecast", "可供量预测", "供应链", "供应计划", "/v1/supply/available-forecast", "查询供应商未来可供量、缺口和风险。", "POST", "角色受限", "试运行"),
      apiDef("arrival", "预计到货与采购交期", "供应链", "交期绩效", "/v1/supply/arrivals", "查询预计到货、实际到货和交期偏差。", "POST", "角色受限"),
      apiDef("supplier-performance", "供应商绩效", "供应链", "交期绩效", "/v1/supply/supplier-performance", "查询准时交付率、质量和响应绩效。", "POST", "角色受限"),
      apiDef("ad-campaigns", "广告活动查询", "广告", "广告结构", "/v1/ads/campaigns", "查询广告活动、预算、状态和投放策略。", "POST"),
      apiDef("ad-groups", "广告组与投放商品", "广告", "广告结构", "/v1/ads/ad-groups", "查询广告组、投放商品和匹配方式。", "POST"),
      apiDef("keywords", "关键词与搜索词", "广告", "关键词", "/v1/ads/keywords", "查询关键词、搜索词、竞价和匹配类型。", "POST"),
      apiDef("ad-spend", "广告花费与转化", "广告", "投放数据", "/v1/ads/performance", "查询展示、点击、花费、订单和销售额。", "POST", "已授权", "已认证", "8.4万"),
      apiDef("ad-metrics", "ACOS / ROAS 指标", "广告", "效果指标", "/v1/ads/metrics", "查询 ACOS、ROAS、CTR、CPC 和 CVR。", "POST"),
      apiDef("inventory", "实时可售库存", "库存", "实时库存", "/v1/inventory/available", "查询仓库 SKU 可售、锁定和不可售库存。", "GET", "角色受限", "已认证", "7.4万"),
      apiDef("warehouse-stock", "仓库库存快照", "库存", "实时库存", "/v1/inventory/snapshot", "查询仓库日结库存和库存状态。", "POST", "角色受限"),
      apiDef("inbound-stock", "在途库存查询", "库存", "在途库存", "/v1/inventory/inbound", "查询采购、调拨和头程在途库存。", "POST", "角色受限"),
      apiDef("inventory-health", "库存健康与可售天数", "库存", "库存健康", "/v1/inventory/health", "查询覆盖天数、缺货、滞销和健康标签。", "POST", "角色受限"),
      apiDef("inventory-turnover", "库存周转指标", "库存", "库存健康", "/v1/inventory/turnover", "查询周转率、周转天数和库存资金。", "POST", "角色受限"),
      apiDef("inventory-ledger", "库存调整流水", "库存", "库存流水", "/v1/inventory/ledger", "查询入库、出库、盘点和调整记录。", "POST", "角色受限"),
      apiDef("shipments", "发货单查询", "物流", "发货履约", "/v1/logistics/shipments", "查询发货单、包裹、承运商和发货状态。", "POST"),
      apiDef("tracking", "物流轨迹查询", "物流", "物流轨迹", "/v1/logistics/tracking/{tracking_no}", "查询包裹节点、当前状态和预计送达。"),
      apiDef("channels", "物流渠道查询", "物流", "渠道运费", "/v1/logistics/channels", "查询渠道、服务等级、覆盖国家和限制。"),
      apiDef("freight", "运费明细查询", "物流", "渠道运费", "/v1/logistics/freight", "查询头程、尾程和附加费用。", "POST", "角色受限"),
      apiDef("delivery-sla", "妥投时效指标", "物流", "时效异常", "/v1/logistics/delivery-sla", "查询平均妥投、准时率和时效分布。", "POST"),
      apiDef("logistics-exceptions", "异常包裹查询", "物流", "时效异常", "/v1/logistics/exceptions", "查询延误、丢件、破损和退回包裹。", "POST"),

      if (createAppFromApi) createAppFromApi.addEventListener("click", () => state.selectedApi.access === "已授权" ? openCreateApp() : showRoleRequirement());
      content.querySelectorAll("[data-log]").forEach(el => el.addEventListener("click", () => showLogDetail(el.dataset.log)));
      const newRole = document.getElementById("newRole");
      if (newRole) newRole.addEventListener("click", () => openRoleModal("新建角色权限包"));
      content.querySelectorAll("[data-edit-role]").forEach(el => el.addEventListener("click", () => openRoleModal(`配置：${el.dataset.editRole}`)));
      const newTag = document.getElementById("newTag");
      if (newTag) newTag.addEventListener("click", () => openTagModal("新建标签"));
      const batchTag = document.getElementById("batchTag");
      if (batchTag) batchTag.addEventListener("click", () => openTagModal("批量打标签"));
      content.querySelectorAll("[data-tag-edit]").forEach(el => el.addEventListener("click", () => openTagModal(`编辑标签：${el.dataset.tagEdit}`)));
      const runSimulation = document.getElementById("runSimulation");
      if (runSimulation) runSimulation.addEventListener("click", renderSimulationResult);
    }

    function downloadApiDocument(type) {
      const api = state.selectedApi;
      const documentData = type === "OpenAPI" ? {
        openapi: "3.0.3",
        info: { title: api.name, version: "1.4.0", description: api.desc },
        servers: [{ url: "https://api-test.company.internal" }, { url: "https://api.company.internal" }],
        paths: { [api.endpoint]: { [api.method.toLowerCase()]: { summary: api.name, security: [{ bearerAuth: [] }], responses: { "200": { description: "成功" }, "403": { description: "权限不足" }, "429": { description: "超出配额" } } } } },
        components: { securitySchemes: { bearerAuth: { type: "http", scheme: "bearer" } } }
      } : {
        info: { name: `${api.name} · Postman Collection`, schema: "https://schema.getpostman.com/json/collection/v2.1.0/collection.json" },
        item: [{ name: api.name, request: { method: api.method, header: [{ key: "Authorization", value: "Bearer {{access_token}}" }, { key: "X-Client-Id", value: "{{client_id}}" }], url: `{{base_url}}${sampleEndpoint(api)}` } }],
        variable: [{ key: "base_url", value: "https://api-test.company.internal" }]
      };
      const blob = new Blob([JSON.stringify(documentData, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${api.id}-${type.toLowerCase()}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast(`${type} 文档已生成`);
    }

    function openModal(title, body, foot, small = false) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;
      modalFoot.innerHTML = foot || `<button class="btn" id="modalCancel">关闭</button>`;
      modal.classList.toggle("sm", small);
      backdrop.classList.add("open");
      document.body.style.overflow = "hidden";
      const cancel = document.getElementById("modalCancel");
      if (cancel) cancel.addEventListener("click", closeModal);
    }

    function closeModal() {
      backdrop.classList.remove("open");
      document.body.style.overflow = "";
      modal.classList.remove("sm");
    }

    function openCreateApp() {
      openModal("创建内部应用", `
        <div class="form-group"><label>应用名称</label><input id="appName" placeholder="例如：北美经营分析助手" /></div>
        <div class="form-group"><label>所属业务线</label><select><option>北美事业部</option><option>欧洲事业部</option><option>供应链中心</option><option>产品中心</option></select></div>
        <div class="form-group"><label>使用环境</label><select id="appEnv"><option>测试</option><option>生产</option></select></div>
        <div class="form-group"><label>使用说明</label><textarea placeholder="说明业务场景和调用目的"></textarea></div>
        <div class="notice">应用将继承创建人的岗位角色权限包，无需逐个申请 API。生产环境调用会启用更严格限流和审计。</div>`,
        `<button class="btn" id="modalCancel">取消</button><button class="btn primary" id="saveApp">创建并生成凭证</button>`, true);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("saveApp").addEventListener("click", () => {
        const name = document.getElementById("appName").value.trim() || "北美经营分析助手";
        state.apps.push({ name, owner: "北美事业部", env: document.getElementById("appEnv").value, apiCount: 4, clientId: `app_${Date.now().toString(36)}`, status: "正常" });
        closeModal(); showToast("应用创建成功，凭证已生成"); navigate("apps");
      });
    }

    function showRoleRequirement() {
      openModal("当前角色权限不足", `<div class="notice warning">该 API 需要“供应链计划”或“供应链研发”岗位角色。平台采用岗位角色自动授权，请联系组织管理员确认岗位角色，不支持个人逐项申请。</div>
        <div style="margin-top:14px"><strong>当前角色</strong><p class="list-sub">业务研发 · 北美事业部</p><strong>所需角色</strong><p class="list-sub">供应链计划 / 供应链研发 / 平台管理员</p></div>`, `<button class="btn" id="modalCancel">知道了</button>`, true);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
    }

    function showLogDetail(trace) {
      openModal(`调用详情 · ${trace}`, `
        <div class="cards-3"><div class="card stat-card"><div class="stat-label">状态</div><div class="stat-value" style="font-size:18px">403</div></div><div class="card stat-card"><div class="stat-label">耗时</div><div class="stat-value" style="font-size:18px">18ms</div></div><div class="card stat-card"><div class="stat-label">环境</div><div class="stat-value" style="font-size:18px">生产</div></div></div>
        <h3 class="section-title" style="margin-top:18px">失败原因</h3><div class="notice warning">当前应用岗位角色不包含供应链库存明细权限。请检查应用所属业务线和角色权限包。</div>
        <h3 class="section-title" style="margin-top:18px">请求摘要</h3><div class="code-box">GET /v1/inventory/available?sku=AUVON-TENS-24M
Client-ID: app_ops_us_8f21
Role-Package: business-developer</div>`, `<button class="btn" id="modalCancel">关闭</button>`);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
    }

    function openTagModal(title) {
      openModal(title, `
        <div class="form-group"><label>标签名称</label><input value="${title.startsWith("编辑标签：") ? title.replace("编辑标签：", "") : ""}" placeholder="例如：敏感成本" /></div>
        <div class="form-group"><label>标签分组</label><select>${tagGroups.map(group => `<option>${group.name}</option>`).join("")}</select></div>
        <div class="form-group"><label>适用对象</label><select><option>API 与字段</option><option>仅 API</option><option>仅字段</option></select></div>
        <div class="form-group"><label>标签定义</label><textarea placeholder="说明标签的业务定义、适用范围和使用规则"></textarea></div>
        <div class="notice">标签变更将同步影响 API 市场筛选、字段说明和权限策略，并写入审计日志。</div>`,
        `<button class="btn" id="modalCancel">取消</button><button class="btn primary" id="saveTag">保存标签</button>`, true);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("saveTag").addEventListener("click", () => { closeModal(); showToast("标签已保存并同步关联资产"); });
    }

    function openRoleModal(title) {
      const currentName = title.startsWith("配置") ? title.replace("配置：", "") : "";
      openModal(title, `
        <div class="notice warning" style="margin-bottom:14px"><strong>默认拒绝、拒绝优先。</strong> 只有被角色明确允许的数据资产、BI 报表、API、数据行和字段才能访问。</div>
        <div class="form-group"><label>角色名称</label><input value="${currentName}" placeholder="例如：产品经理" /></div>
        <div class="form-group"><label>适用组织</label><select><option>所有业务线</option><option>产品中心</option><option>运营中心</option><option>供应链中心</option><option>财务中心</option></select></div>
        <div class="policy-grid">
          <div class="policy-block"><h3>1. 资产与服务权限</h3><p>按资产类型授权，并继承到关联 API 与 BI。</p><div class="checkbox-grid">
            ${["主数据","分析数据","爬虫数据","竞品分析","BI 报表","API 服务"].map((type, index) => `<label class="checkbox-row"><input type="checkbox" ${index < 2 ? "checked" : ""} />${type} <span class="category-count">${type === "BI 报表" ? biReports.length : type === "API 服务" ? apis.length : dataAssets.filter(asset => asset.type === type).length}</span></label>`).join("")}
          </div></div>
          <div class="policy-block"><h3>2. 行级数据范围</h3><p>使用当前用户属性动态过滤返回数据。</p>
            <div class="form-group"><label>事业部</label><select><option>等于当前用户.事业部</option><option>授权事业部列表</option><option>全部拒绝</option></select></div>
            <div class="form-group"><label>站点</label><select><option>包含于当前用户.授权站点</option><option>仅 US</option><option>全部拒绝</option></select></div>
            <div class="form-group"><label>仓库 / 店铺</label><select><option>包含于当前用户.授权范围</option><option>不限制</option><option>全部拒绝</option></select></div>
          </div>
          <div class="policy-block"><h3>3. 列级字段控制</h3><p>勾选后字段从 API 响应中完全隐藏。</p><div class="checkbox-grid">
            <label class="checkbox-row"><input type="checkbox" checked />unit_cost</label>
            <label class="checkbox-row"><input type="checkbox" checked />profit</label>
            <label class="checkbox-row"><input type="checkbox" />supplier_contact</label>
            <label class="checkbox-row"><input type="checkbox" checked />user_email</label>
            <label class="checkbox-row"><input type="checkbox" />phone</label>
            <label class="checkbox-row"><input type="checkbox" />internal_note</label>
          </div></div>
        </div>`,
        `<button class="btn" id="modalCancel">取消</button><button class="btn" id="testRole">模拟验证</button><button class="btn primary" id="saveRole">保存并生成新版本</button>`);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("testRole").addEventListener("click", () => { closeModal(); navigate("simulator"); });
      document.getElementById("saveRole").addEventListener("click", () => { closeModal(); showToast("角色策略 v3.3 已保存并记录审计"); });
    }

    function renderSimulationResult() {
      const api = apis.find(item => item.id === document.getElementById("simApi").value) || apis[0];
      const asset = dataAssets.find(item => item.id === document.getElementById("simAsset").value) || dataAssets[0];
      const user = document.getElementById("simUser").value;
      const allowed = api.access === "已授权" || user.includes("供应链") || user.includes("财务");
      document.getElementById("simulationResult").innerHTML = `
        <div class="card-head"><strong>模拟结果 · ${asset.name} → ${api.name}</strong>${badge(allowed ? "允许调用" : "拒绝调用")}</div>
        <div class="card-body">
          <div class="permission-result">
            <div class="result-panel"><strong>命中策略</strong><ul><li>角色包：${user.split(" · ").pop()}</li><li>资产：${asset.id}</li><li>API：${allowed ? "显式允许" : "未显式授权"}</li><li>优先级：拒绝优先</li></ul></div>
            <div class="result-panel"><strong>允许的数据行</strong><ul><li>business_unit = NorthAmerica</li><li>site IN [US, CA]</li><li>warehouse IN [LAX-01]</li></ul></div>
            <div class="result-panel"><strong>隐藏字段</strong><ul><li>unit_cost</li><li>profit</li><li>user_email</li></ul></div>
          </div>
          <h3 class="section-title" style="margin-top:16px">最终响应预览</h3>
          <div class="code-box">${allowed ? `{
  "sku": "AUVON-TENS-24M",
  "site": "US",
  "warehouse": "LAX-01",
  "available_qty": 1260,
  "_hidden_fields": ["unit_cost", "profit", "user_email"]
}` : `{
  "code": 403,
  "message": "默认拒绝：当前角色未被授予该资产或关联 API"
}`}</div>
        </div>`;
    }

    const wizardLabels = {
      existing: ["导入定义", "业务信息", "权限策略", "测试校验", "发布"],
      dataset: ["选择数据集", "选择字段", "查询配置", "安全策略", "发布"]
    };

    function openWizard(type) {
      state.wizardType = type; state.wizardStep = 0;
      renderWizard();
    }

    function renderWizard() {
      const labels = wizardLabels[state.wizardType];
      const title = state.wizardType === "existing" ? "登记已有 API" : "从数据集生成 API";
      const stepContent = wizardStepContent();
      openModal(title, `<div class="wizard-steps">${labels.map((l,i) => `<div class="wizard-step ${i === state.wizardStep ? "active" : i < state.wizardStep ? "done" : ""}">${i+1}. ${l}</div>`).join("")}</div>${stepContent}`,
        `<button class="btn" id="wizardCancel">${state.wizardStep === 0 ? "取消" : "上一步"}</button><button class="btn primary" id="wizardNext">${state.wizardStep === 4 ? "确认发布" : "下一步"}</button>`);
      document.getElementById("wizardCancel").addEventListener("click", () => {
        if (state.wizardStep === 0) closeModal(); else { state.wizardStep--; renderWizard(); }
      });
      document.getElementById("wizardNext").addEventListener("click", () => {
        if (state.wizardStep < 4) { state.wizardStep++; renderWizard(); }
        else { closeModal(); showToast("API 已发布到测试环境"); navigate("assets"); }
      });
    }

    function wizardStepContent() {
      const step = state.wizardStep;
      if (state.wizardType === "existing") {
        if (step === 0) return `<div class="form-group"><label>OpenAPI / Swagger 地址</label><input value="https://service.internal/openapi.json" /></div><div class="form-group"><label>目标网关环境</label><select><option>测试环境</option><option>生产环境</option></select></div><div class="notice success">已识别 6 个 Endpoint、18 个 Schema，定义格式校验通过。</div>`;
        if (step === 1) return `<div class="form-group"><label>API 名称</label><input value="Amazon 广告活动查询" /></div><div class="form-group"><label>资产域</label><select><option>经营分析</option><option>产品主数据</option><option>供应链</option></select></div><div class="form-group"><label>Owner</label><input value="广告数据组" /></div><div class="form-group"><label>业务说明</label><textarea>查询站点广告活动、预算、花费与效果指标。</textarea></div>`;
        if (step === 2) return `<div class="form-group"><label>岗位角色权限包</label><select multiple style="height:100px;padding:8px"><option selected>业务研发</option><option selected>运营分析师</option><option>财务分析</option><option>产品经理</option></select></div><div class="form-group"><label>敏感等级</label><select><option>L2 · 内部受限</option><option>L1 · 内部公开</option><option>L3 · 敏感</option></select></div><div class="notice">角色成员将自动获得访问权限，所有调用仍使用应用凭证并记录审计。</div>`;
      } else {
        if (step === 0) return `<div class="form-group"><label>数据连接</label><select><option>StarRocks · dws_production</option><option>MySQL · product_master</option><option>PostgreSQL · competitor_db</option></select></div><div class="form-group"><label>认证数据集</label><select><option>dws_inventory_health_daily</option><option>dws_sku_sales_daily</option><option>dim_product_master</option></select></div><div class="notice success">数据集质量通过率 99.98%，Owner：供应链数据组，刷新频率：每小时。</div>`;
        if (step === 1) return `<table><thead><tr><th>选择</th><th>字段</th><th>类型</th><th>说明</th></tr></thead><tbody><tr><td>✓</td><td>sku</td><td>string</td><td>SKU 编码</td></tr><tr><td>✓</td><td>warehouse_code</td><td>string</td><td>仓库编码</td></tr><tr><td>✓</td><td>available_qty</td><td>integer</td><td>可售库存</td></tr><tr><td>✓</td><td>coverage_days</td><td>decimal</td><td>库存覆盖天数</td></tr><tr><td>—</td><td>unit_cost</td><td>decimal</td><td>单位成本（敏感）</td></tr></tbody></table>`;
        if (step === 2) return `<div class="form-group"><label>Endpoint</label><input value="/v1/inventory/available" /></div><div class="form-group"><label>必填查询参数</label><input value="sku, warehouse_code" /></div><div class="form-group"><label>单次最大返回</label><select><option>100 条</option><option>500 条</option><option>1000 条</option></select></div><div class="form-group"><label>缓存策略</label><select><option>缓存 5 分钟</option><option>不缓存</option><option>缓存 30 分钟</option></select></div>`;
      }
      if (step === 3) return `<div class="form-group"><label>限流策略</label><select><option>每应用 300 次/分钟</option><option>每应用 100 次/分钟</option></select></div><div class="form-group"><label>字段保护</label><select><option>按角色字段脱敏</option><option>不返回敏感字段</option></select></div><div class="form-group"><label>服务 SLA</label><select><option>99.90% · P95 ≤ 300ms</option><option>99.50% · P95 ≤ 500ms</option></select></div><div class="notice success">文档完整度 100%，Schema 兼容检查通过，测试用例 8/8 通过。</div>`;
      return `<div class="notice success"><strong>发布检查已通过</strong><br/>业务信息完整 · Owner 已确认 · 角色权限已配置 · 文档完整度 100% · 测试 8/8 通过 · 回滚版本已生成</div><div style="margin-top:14px" class="list"><div class="list-row"><div><div class="list-title">发布环境</div><div class="list-sub">测试环境</div></div>${badge("就绪")}</div><div class="list-row"><div><div class="list-title">版本</div><div class="list-sub">v1.0.0</div></div>${badge("新版本")}</div><div class="list-row"><div><div class="list-title">通知范围</div><div class="list-sub">Owner、平台管理员、角色权限包成员</div></div>${badge("自动通知")}</div></div>`;
    }

    function showToast(message) {
      toast.textContent = message; toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.querySelectorAll(".nav-item").forEach(item => item.addEventListener("click", () => navigate(item.dataset.page)));
    document.getElementById("roleSelect").addEventListener("change", (event) => {
      state.role = event.target.value;
      localStorage.setItem("datahub-demo-role", state.role);
      if (state.role === "consumer" && ["assets","publish","tags","quality","roles","simulator","operations","audit"].includes(state.page)) state.page = "overview";
      if (state.role === "publisher" && ["tags","quality","roles","simulator","operations","audit"].includes(state.page)) state.page = "assets";
      renderPage();
      showToast("演示角色已切换");
    });
    document.getElementById("globalSearch").addEventListener("keydown", (event) => {
      if (event.key === "Enter") { state.assetKeyword = event.target.value; state.assetType = ""; state.assetDomain = ""; navigate("assetCatalog"); }
    });
    document.getElementById("mobileMenu").addEventListener("click", () => sidebar.classList.toggle("open"));
    document.getElementById("modalClose").addEventListener("click", closeModal);
    backdrop.addEventListener("click", event => { if (event.target === backdrop) closeModal(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });

    document.getElementById("roleSelect").value = state.role;
    renderPage();
  </script>
</body>
</html>
